name: CI Pipeline

on:
  pull_request:
    branches: ["master"]

  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: run typecheck script
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: run tests
        run: bun test
